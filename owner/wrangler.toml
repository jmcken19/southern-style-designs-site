# GENERATED by scripts/configure.mjs from client.config.json – edit that file, then run `npm run configure`.
# Owner editor for Example Business (Cloudflare Worker, free plan).
name = "example-business-editor"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./ui"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "example-business-editor"
database_id = "" # TODO: npx wrangler d1 create example-business-editor
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "PHOTOS"
id = "" # TODO: npx wrangler kv namespace create PHOTOS

[vars]
GITHUB_REPO = "OWNER/example-business-site"
GITHUB_BRANCH = "main"
# The live website. Before launch you can point this at the GitHub Pages testing link.
PUBLIC_SITE_URL = "https://www.example.com"
ACCESS_TEAM_DOMAIN = "" # TODO: Cloudflare Zero Trust team domain
ACCESS_AUD = "" # TODO: Access application AUD tag
SUPPORT_NAME = "James McKenna"

# Secrets (set with: npx wrangler secret put NAME):
#   GITHUB_TOKEN       fine-grained token: this repo only, Contents read/write, Actions read/write
#   OWNER_EMAILS       the owner's sign-in email(s), comma-separated
#   MAINTAINER_EMAILS  your sign-in email
#   SUPPORT_EMAIL      shown to the owner as their help contact
#   SUPPORT_PHONE      (optional) shown to the owner as their help contact
