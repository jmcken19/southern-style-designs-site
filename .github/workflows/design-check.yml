name: Design check

# Runs the Impeccable design detector (62 rules: AI-looking UI, contrast, headings, broken layout) on the built site.
# Warning only: findings show as annotations on the commit / pull request and never block publishing.
# Triage them with the `impeccable` skill: fix real problems; record confirmed false positives in .impeccable/config.json.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build.mjs
      - name: Impeccable detect
        run: npx impeccable detect --github --no-advisory dist
