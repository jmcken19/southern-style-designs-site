name: Update owner editor (Cloudflare)

# Puts a new version of the owner editor (owner/) live when its code, the site's code (src/), the content
# (content/) or client.config.json changes. Photo-only changes (public/) don't need a new editor.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-editor
  cancel-in-progress: false

jobs:
  deploy:
    # The template repo itself has no website – only client repos made from it publish.
    if: ${{ !endsWith(github.repository, '/client-site-template') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the editor change?
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "deploy=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The editor bundles the site's code and content (its page preview is built from them), so it is
          # redeployed whenever any of them change – including the owner's own publishes – and never shows stale text.
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^(owner/|src/|content/|client.config.json)'; then
            echo "deploy=yes" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.deploy == 'yes'
        with:
          node-version: 22
          cache: npm
      - if: steps.changed.outputs.deploy == 'yes'
        run: npm ci
      - if: steps.changed.outputs.deploy == 'yes'
        run: npm test
      - name: Deploy editor
        if: steps.changed.outputs.deploy == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::No CLOUDFLARE_API_TOKEN secret – editor deploy skipped."; exit 0; fi
          cd owner && npx wrangler deploy
