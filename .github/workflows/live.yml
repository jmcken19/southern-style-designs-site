name: Publish live website (Cloudflare)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-site
  cancel-in-progress: false

jobs:
  deploy:
    # The template repo itself has no website – only client repos made from it publish.
    if: ${{ !endsWith(github.repository, '/client-site-template') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the live website
        run: |
          export SITE_URL="https://$(node -p "require('./client.config.json').domain.main")"
          node scripts/build.mjs
        env:
          OUT_DIR: dist-prod
          BUILD_ID: ${{ github.sha }}
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set yet – live deploy skipped (see docs/PLAYBOOK.md)."
            exit 0
          fi
          cd site && npx wrangler deploy
